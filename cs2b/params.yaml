# Lab 2B / Case Study 2B parameters. Every notebook and script reads this file.
release: "2026_05"            # fallback for notebooks and tools only; the dvc.yaml pipeline reads releases
releases: ["2026_04", "2026_05", "2026_06"]   # required by the dvc.yaml pipeline, even for one release (e.g. ["2026_05"]); Team 2 quarter 2026q2
data:
  use_fixture: false           # real data
  raw_dir: data/raw
  fixture_dir: data/fixture
sec:
  user_agent: "Sai Guna Vardhan Vudatala vudatala.s@northeastern.edu"   # the SEC requires a name and an email
  base_url: "https://www.sec.gov/files/datastandardsinnovation/data/business-development-company-bdc-data-sets/"
reconcile:
  tolerance: 0.01             # admit a filing when |holdings - filed| / filed <= tolerance
outputs:
  panel: outputs/panel
  reports: reports
triage:
  input: data/triage.csv       # human-reviewed evidence; report generation never edits this
cleaning:
  rules: [rule_source_disclosures, rule_totals, rule_cash, rule_jv_portfolio, rule_issuer_subtotals, rule_rollforward_copies]

source_evidence:
  input: data/source_evidence.json
  documents: data/source_filings
