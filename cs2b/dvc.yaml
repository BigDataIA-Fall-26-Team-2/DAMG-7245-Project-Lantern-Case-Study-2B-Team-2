# Case Study 2B pipeline: dvc pull && dvc repro rebuilds the panel and reports.
# Each stage calls existing functions in src/lookthrough/ in the same order as
# pipeline.run_baseline; no logic lives in the stage scripts.
stages:
  acquire:
    cmd: python scripts/acquire.py
    deps:
      - scripts/acquire.py
      - src/lookthrough/acquire.py
      - data/manifest.json
      - data/raw
    outs:
      - reports/manifest_check.json:
          cache: false

  parse:
    cmd: python scripts/parse.py
    deps:
      - scripts/parse.py
      - src/lookthrough/combine.py
      - src/lookthrough/load.py
      - src/lookthrough/mapping.py
      - src/lookthrough/holdings.py
      - src/lookthrough/paths.py
      - reports/manifest_check.json
      - data/raw
    params:
      - releases
      - data.raw_dir
    outs:
      - outputs/work/sub.parquet
      - outputs/work/num.parquet
      - outputs/work/canon.parquet
      - outputs/work/holdings.parquet

  clean:
    cmd: python scripts/clean.py
    deps:
      - scripts/clean.py
      - src/lookthrough/clean.py
      - src/lookthrough/pipeline.py
      - outputs/work/holdings.parquet
    params:
      - cleaning.rules
    outs:
      - outputs/work/kept.parquet
      - outputs/work/log.parquet

  reconcile:
    cmd: python scripts/reconcile.py
    deps:
      - scripts/reconcile.py
      - src/lookthrough/reconcile.py
      - outputs/work/kept.parquet
      - outputs/work/sub.parquet
      - outputs/work/num.parquet
      - outputs/work/canon.parquet
    params:
      - reconcile.tolerance
    outs:
      - outputs/work/rec.parquet
      - outputs/work/diag.parquet

  report:
    cmd: python scripts/report.py
    deps:
      - scripts/report.py
      - src/lookthrough/report.py
      - src/lookthrough/reconcile.py
      - src/lookthrough/tables.py
      - data/triage.csv
      - outputs/work/kept.parquet
      - outputs/work/rec.parquet
      - outputs/work/diag.parquet
      - outputs/work/log.parquet
      - outputs/work/sub.parquet
    params:
      - outputs
      - triage.input
    outs:
      - outputs/panel
      - reports/coverage.csv:
          cache: false
      - reports/coverage.md:
          cache: false
      - reports/triage.md:
          cache: false
      - reports/cleaning_log.csv:
          cache: false
    metrics:
      - reports/coverage.json:
          cache: false